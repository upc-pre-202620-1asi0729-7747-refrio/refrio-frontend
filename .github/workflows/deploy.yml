name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps # Cambiado a npm install para evitar fallos estrictos del lockfile

      - name: Compilar Angular
        run: npx ng build refrio-frontend --configuration production --base-href /refrio-frontend/

      - name: Generar 404.html para rutas SPA
        # Duplica el index.html para que GitHub Pages soporte las rutas internas de Angular
        run: cp ./dist/refrio-frontend/browser/index.html ./dist/refrio-frontend/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/refrio-frontend/browser

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Refrio — Control Tower</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Refrio Cold Chain Control Tower — Monitor perishable inventory, active shipments, and operational risks from one centralized dashboard." />
    <link rel="icon" type="image/x-icon" href="RefrioLogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="error-display" style="color: red; font-family: monospace; white-space: pre-wrap; z-index: 9999; position: relative;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var el = document.getElementById('error-display');
        el.style.padding = '20px';
        el.innerText += '\n' + message + '\n' + (error && error.stack ? error.stack : '');
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('error-display');
        el.style.padding = '20px';
        el.innerText += '\nUnhandled promise rejection: ' + event.reason;
      });
    </script>
    <app-root></app-root>
  </body>
</html>

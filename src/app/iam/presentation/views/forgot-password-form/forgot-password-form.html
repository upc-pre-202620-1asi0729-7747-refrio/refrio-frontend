<div class="forgot-page">
  <button type="button" class="lang-toggle" (click)="translationService.toggleLanguage()">
    <span class="material-symbols-outlined" style="font-size: 18px;">language</span>
    {{ translationService.currentLang() === 'en' ? 'EN' : 'ES' }}
  </button>

  <div class="forgot-container">
    <div class="brand-logo-center">
      <img src="RefrioLogo.png" alt="Refrio Logo" style="height: 60px; margin-bottom: 24px;">
    </div>

    <div class="forgot-card">
      <h2>{{ 'AUTH.FORGOT_TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'AUTH.FORGOT_SUBTITLE' | translate }}</p>

      <form (ngSubmit)="onSubmit()" class="forgot-form">
        <div class="form-group">
          <label for="forgot-email">{{ 'AUTH.FORGOT_EMAIL' | translate }}</label>
          <div class="input-wrapper">
            <span class="input-icon material-symbols-outlined">mail</span>
            <input id="forgot-email" type="email" [(ngModel)]="email" name="email"
              [placeholder]="'AUTH.FORGOT_EMAIL_PLACEHOLDER' | translate" required />
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
          <span class="spinner"></span>
          } @else {
          {{ 'AUTH.FORGOT_SEND_BTN' | translate }}
          }
        </button>

        <div class="back-link-wrapper">
          <a routerLink="/sign-in" class="back-link">
            <span class="material-symbols-outlined">arrow_back</span>
            {{ 'AUTH.FORGOT_BACK' | translate }}
          </a>
        </div>
      </form>
    </div>

    <div class="forgot-footer">
      <p class="note"><strong>{{ 'AUTH.FORGOT_NOTE_LBL' | translate }}</strong> {{ 'AUTH.FORGOT_NOTE_TXT' | translate }}
      </p>
    </div>
  </div>
</div>

<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
  rel="stylesheet" />
